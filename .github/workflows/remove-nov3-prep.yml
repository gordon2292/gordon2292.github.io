name: Remove temporary Nov 3 assessment notes

on:
  schedule:
    - cron: '15 16 3 11 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-temporary-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove expired assessment material
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("science/index.html")
          index_text = index_path.read_text(encoding="utf-8")
          index_text = re.sub(
              r'\n        <section class="temporary-prep-banner".*?\n        </section>\n',
              '\n',
              index_text,
              flags=re.S,
          )
          index_text = re.sub(
              r'\n          <a href="#nov3-prep-note" data-temporary-nov3>.*?</a>',
              '',
              index_text,
          )
          index_text = re.sub(
              r'\n          <details class="note-card temporary-prep-note" id="nov3-prep-note" data-temporary-nov3>.*?\n          </details>',
              '',
              index_text,
              flags=re.S,
          )
          index_path.write_text(index_text, encoding="utf-8")

          app_path = Path("science/app.js")
          app_text = app_path.read_text(encoding="utf-8")
          app_text = re.sub(
              r"const temporaryDeadline = .*?\n}\n\n",
              "",
              app_text,
              count=1,
              flags=re.S,
          )
          app_path.write_text(app_text, encoding="utf-8")
          PY
      - name: Commit the cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-nov3-prep.yml
          git add science/index.html science/app.js
          git commit -m "Remove expired Nov 3 assessment prep"
          git push
